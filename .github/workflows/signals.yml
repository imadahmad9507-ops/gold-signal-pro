name: Gold Signal Pro Automated Engine

on:
  schedule:
    # Runs every 15 minutes Monday through Friday (UTC)
    - cron: '*/15 * * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      send_demo_alert:
        description: 'Send a demo A+ alert preview to Telegram? (yes/no)'
        required: false
        default: 'no'

permissions:
  contents: write

jobs:
  run-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m pytest tests/

      - name: Send Demo A+ Alert Preview (Manual Trigger Only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.send_demo_alert == 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python send_demo_alert.py

      - name: Execute Signal & Analysis Cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      - name: Commit Tracker Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tracking/signals.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(tracker): update signal state [skip ci]" && git push)
