# gold-signal-pro global configuration

app:
  name: "gold-signal-pro"
  mode: "signal_only"  # strictly alerts only, no order execution
  version: "1.0.0"
  timezone: "UTC"
  log_level: "INFO"
  research_alerts_enabled: false  # Allows local forward-test research alerts while live_enabled remains false

instruments:
  XAUUSD:
    symbol_yf: "GC=F"
    symbol_alt: "XAUUSD=X"
    asset_type: "commodity"
    atr_multiplier: 1.5
    typical_spread_pips: 0.25 # typical Exness gold spread in USD
    pip_value: 1.0 # 0.01 lot per $0.01 movement
    min_stop_distance_pips: 1.5
    active_sessions: ["london", "newyork", "london_ny_overlap"]
    live_enabled: false # Quality gate must pass to set true
    price_offset_calibration: 0.0 # calibration setting for small price differences between Yahoo and Exness
    account_type: "standard" # Options: "standard" (100 oz/lot) or "cent" (1 oz/lot - XAUUSDc)
    research_alerts_enabled: false # Per-instrument override if desired
  EURUSD:
    symbol_yf: "EURUSD=X"
    asset_type: "forex"
    atr_multiplier: 1.5
    typical_spread_pips: 0.00012
    pip_value: 10.0
    min_stop_distance_pips: 0.0008
    active_sessions: ["london", "newyork"]
    live_enabled: false
    price_offset_calibration: 0.0
  GBPUSD:
    symbol_yf: "GBPUSD=X"
    asset_type: "forex"
    atr_multiplier: 1.5
    typical_spread_pips: 0.00015
    pip_value: 10.0
    min_stop_distance_pips: 0.0010
    active_sessions: ["london", "newyork"]
    live_enabled: false
    price_offset_calibration: 0.0
  USDJPY:
    symbol_yf: "USDJPY=X"
    asset_type: "forex"
    atr_multiplier: 1.5
    typical_spread_pips: 0.015
    pip_value: 9.0
    min_stop_distance_pips: 0.10
    active_sessions: ["asian", "london", "newyork"]
    live_enabled: false
    price_offset_calibration: 0.0
  BTCUSD:
    symbol_yf: "BTC-USD"
    asset_type: "crypto"
    atr_multiplier: 2.0
    typical_spread_pips: 15.0
    pip_value: 1.0
    min_stop_distance_pips: 100.0
    active_sessions: ["all"]
    live_enabled: false
    price_offset_calibration: 0.0

intermarket:
  dxy_symbol: "DX-Y.NYB"
  us10y_symbol: "^TNX"
  enabled: true

timeframes:
  entry: "30m"
  confirmations: ["1h", "4h"]
  supported: ["5m", "15m", "30m", "1h", "4h", "1d"]

scoring:
  min_grade_a_plus: 85
  min_grade_a: 75
  min_grade_b: 68
  send_grades: ["A+"] # STRICT CAPITAL PROTECTION: Only Grade A+ Prime Setups allowed to fire
  only_send_a_plus: true # Suppresses all weaker B and standard A setups
  weights:
    trend: 30
    momentum: 15
    volatility: 10
    market_structure: 20
    support_resistance: 10
    candlestick: 5
    intermarket: 5
    regime: 5

risk:
  account_currency: "USD"      # Explicit currency: "USD" or "USC"
  account_balance_usd: 50.0   # Explicit $50 balance for USD account
  # account_balance_usc: 5000.0 # Uncomment when account_currency is "USC" (e.g. 5000 USC)
  account_type: "standard"    # Sizing profile: "standard" (100 oz) or "cent" (1 oz - XAUUSDc)
  risk_per_trade_percent: 0.25 # Exact 0.25% ultra-small risk per trade ($0.125 max loss)
  min_risk_reward: 2.5        # Demand minimum 1:2.5 R:R (strict high reward)
  tp1_r: 1.0
  tp2_r: 2.0
  tp3_r: 3.5
  max_concurrent_signals: 1   # Only 1 trade at a time to prevent overexposure
  cooldown_bars_per_symbol: 6 # Mandatory wait period between setups
  daily_max_loss_r: 2.0
  consecutive_losses_pause: 2 # If 2 losses occur, pause immediately
  pause_duration_hours: 24
  avoid_friday_after_utc: 19
  avoid_sunday_open: true

news_filter:
  enabled: true
  feed_url: "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
  buffer_minutes_before: 30
  buffer_minutes_after: 30
  impact_filter: ["High"]

visual_ai:
  enabled: true
  provider: "gemini"
  model: "gemini-1.5-flash"
  max_score_delta: 5
  min_sample_size_to_evaluate: 20

backtest_quality_gate:
  min_trades: 100
  min_out_of_sample_profit_factor: 1.3
  min_expectancy_r: 0.15
  max_drawdown_percent: 25.0
  cost_spread_multiplier: 1.2
